<div class="docs-shell">
  <div class="wrap docs-wrap">
    <aside class="docs-sidebar">
      <nav class="docs-nav">
        <a class="docs-home-link{% if page.url == '/docs/' %} active{% endif %}" href="{{ '/docs/' | relative_url }}">Getting Started</a>
        <div class="docs-nav-group">
          <p class="docs-nav-label">Backends</p>
          <a href="{{ '/docs/backends/postgres/' | relative_url }}"{% if page.url contains 'postgres' %} class="active"{% endif %}>PostgreSQL</a>
          <a href="{{ '/docs/backends/sqlserver/' | relative_url }}"{% if page.url contains 'sqlserver' %} class="active"{% endif %}>SQL Server</a>
          <a href="{{ '/docs/backends/redis/' | relative_url }}"{% if page.url contains 'redis' %} class="active"{% endif %}>Redis</a>
          <a href="{{ '/docs/backends/sqlite/' | relative_url }}"{% if page.url contains 'sqlite' %} class="active"{% endif %}>SQLite <span class="docs-badge">local dev</span></a>
        </div>
        <div class="docs-nav-group">
          <p class="docs-nav-label">Features</p>
          <a href="{{ '/docs/delivery-controls/' | relative_url }}"{% if page.url contains 'delivery-controls' %} class="active"{% endif %}>Delivery controls</a>
          <a href="{{ '/docs/http-server/' | relative_url }}"{% if page.url contains 'http-server' %} class="active"{% endif %}>HTTPS server <span class="docs-badge">cross-DC</span></a>
        </div>
        <div class="docs-nav-group">
          <p class="docs-nav-label">Guides</p>
          <a href="{{ '/docs/workqueue-to-bus/' | relative_url }}"{% if page.url contains 'workqueue-to-bus' %} class="active"{% endif %}>WorkQueue → Message Bus</a>

        <div class="docs-nav-group">
          <p class="docs-nav-label">Reference</p>
          <a href="{{ '/docs/configuration/' | relative_url }}"{% if page.url contains 'configuration' %} class="active"{% endif %}>Configuration</a>
        </div>
      </nav>
    </aside>
    <main class="docs-content">
      {{ content }}
    </main>
  </div>
</div>
{% include footer.html %}
<script type="module">
  // Render ```mermaid code blocks (kramdown emits them as language-mermaid code).
  const blocks = document.querySelectorAll('div.language-mermaid, pre > code.language-mermaid');
  if (blocks.length) {
    const { default: mermaid } = await import('https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs');
    blocks.forEach(block => {
      const host = block.tagName === 'CODE' ? block.parentElement : block;
      const diagram = document.createElement('pre');
      diagram.className = 'mermaid';
      diagram.textContent = block.textContent;
      host.replaceWith(diagram);
    });
    const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
    await mermaid.run({ querySelector: 'pre.mermaid' });
  }
</script>
